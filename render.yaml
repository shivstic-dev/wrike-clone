services:
  - type: web
    name: wrike-clone-backend
    runtime: node
    region: singapore
    plan: free
    branch: main
    rootDir: .
    buildCommand: npm install && npm run build -w @wrike-clone/shared && npm run build -w @wrike-clone/backend
    startCommand: cd packages/backend && npm run start:prod
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Render injects its own PORT automatically — do not override it.
      - key: API_PREFIX
        value: api/v1
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # Set to your Vercel frontend origin(s) before going live.
      # "*" is fine for testing only.
      - key: CORS_ORIGINS
        sync: false
      # ── Supabase storage + realtime broadcast ──
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: work-management-files
      - key: REALTIME_BROADCAST_ENABLED
        value: "true"
      # ── Optional integrations ──
      - key: SENTRY_DSN
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
