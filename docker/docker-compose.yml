# ──────────────────────────────────────────────
# Wrike Clone — Docker Compose (Production)
# ──────────────────────────────────────────────

name: wrike-clone

networks:
  frontend:
    driver: bridge
    internal: false
  backend:
    driver: bridge
    internal: true
  data:
    driver: bridge
    internal: true

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  metabase_app_data:
    driver: local

services:
  # ── PostgreSQL ──────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: wrike-postgres
    restart: unless-stopped
    networks:
      - data
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-wrike_clone}
      POSTGRES_USER: ${DB_USER:-wrike}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-wrike_dev_password_change_in_prod}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-wrike} -d ${DB_NAME:-wrike_clone}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  # ── Redis ───────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: wrike-redis
    restart: unless-stopped
    networks:
      - data
      - backend
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --auto-aof-rewrite-percentage 100
      --auto-aof-rewrite-min-size 64mb
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  # ── MinIO (S3-compatible object storage) ────
  minio:
    image: minio/minio:latest
    container_name: wrike-minio
    restart: unless-stopped
    networks:
      - data
      - backend
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-wrike_access_key}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-wrike_secret_key_change_in_prod}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  # ── Meilisearch ─────────────────────────────
  meilisearch:
    image: getmeili/meilisearch:v1.12
    container_name: wrike-meilisearch
    restart: unless-stopped
    networks:
      - backend
    ports:
      - "7700:7700"
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_API_KEY:-change_in_production}
      MEILI_NO_ANALYTICS: "true"
      MEILI_ENV: ${NODE_ENV:-production}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  # Metabase state is isolated from the operational CEPAA database.
  metabase-db:
    image: postgres:16-alpine
    container_name: wrike-metabase-db
    restart: unless-stopped
    networks:
      - data
    environment:
      POSTGRES_DB: ${METABASE_APP_DB_NAME:-metabase}
      POSTGRES_USER: ${METABASE_APP_DB_USER:-metabase}
      POSTGRES_PASSWORD: ${METABASE_APP_DB_PASSWORD:?METABASE_APP_DB_PASSWORD is required}
    volumes:
      - metabase_app_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${METABASE_APP_DB_USER:-metabase} -d ${METABASE_APP_DB_NAME:-metabase}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Data-source credentials are entered once in Metabase Admin and are not
  # shared with the CEPAA application container.
  metabase:
    image: metabase/metabase:v0.63.2.x
    container_name: wrike-metabase
    restart: unless-stopped
    networks:
      - frontend
      - data
    ports:
      - "3000:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: metabase-db
      MB_DB_PORT: 5432
      MB_DB_DBNAME: ${METABASE_APP_DB_NAME:-metabase}
      MB_DB_USER: ${METABASE_APP_DB_USER:-metabase}
      MB_DB_PASS: ${METABASE_APP_DB_PASSWORD:?METABASE_APP_DB_PASSWORD is required}
      MB_ENCRYPTION_SECRET_KEY: ${METABASE_ENCRYPTION_SECRET_KEY:?METABASE_ENCRYPTION_SECRET_KEY is required}
      MB_SITE_URL: ${METABASE_SITE_URL:-http://localhost:3000}
    depends_on:
      metabase-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"

  # ── Backend (NestJS API) ────────────────────
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: wrike-backend
    restart: unless-stopped
    networks:
      - backend
      - frontend
    ports:
      - "4000:4000"
    env_file:
      - ../.env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DB_HOST: postgres
      REDIS_HOST: redis
      S3_ENDPOINT: http://minio:9000
      MEILISEARCH_HOST: http://meilisearch:7700
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  # ── Frontend (React SPA via Nginx) ──────────
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: wrike-frontend
    restart: unless-stopped
    networks:
      - frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/healthz.html"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
