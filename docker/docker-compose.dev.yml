# ──────────────────────────────────────────────
# Wrike Clone — Docker Compose (Development)
# Extended overrides for local development
# ──────────────────────────────────────────────

name: wrike-clone-dev

services:
  # ── PostgreSQL ──────────────────────────────
  postgres:
    ports:
      - "${DB_PORT:-5432}:5432"

  # ── Redis ───────────────────────────────────
  redis:
    ports:
      - "${REDIS_PORT:-6379}:6379"

  # ── MinIO ───────────────────────────────────
  minio:
    ports:
      - "${S3_API_PORT:-9000}:9000"
      - "${S3_CONSOLE_PORT:-9001}:9001"

  # ── Meilisearch ─────────────────────────────
  meilisearch:
    ports:
      - "${MEILISEARCH_PORT:-7700}:7700"

  # ── Backend (with hot reload) ───────────────
  backend:
    build:
      target: builder
    container_name: wrike-backend-dev
    ports:
      - "${APP_PORT:-4000}:4000"
      - "9229:9229" # Debug port (node --inspect)
    volumes:
      # Mount source for hot reload
      - ../packages/backend/src:/app/packages/backend/src:ro
      - ../packages/shared/src:/app/packages/shared/src:ro
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug
      LOG_FORMAT: pretty
    command: >
      sh -c "npm run build -w packages/shared && npx nest start -w packages/backend --watch --preserveWatchOutput"

  # ── Frontend (with Vite dev server) ─────────
  frontend:
    build:
      target: builder
      dockerfile: docker/Dockerfile.frontend
    container_name: wrike-frontend-dev
    ports:
      - "5173:5173" # Vite dev server
      - "80:80"
    volumes:
      # Mount source for hot reload
      - ../packages/frontend/src:/app/packages/frontend/src:ro
      - ../packages/frontend/public:/app/packages/frontend/public:ro
      - ../packages/frontend/index.html:/app/packages/frontend/index.html:ro
    environment:
      NODE_ENV: development
      VITE_API_BASE_URL: http://localhost:4000
    command: >
      sh -c "npm run dev -w packages/frontend -- --host 0.0.0.0 --port 5173"
