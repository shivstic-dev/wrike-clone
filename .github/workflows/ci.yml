# ──────────────────────────────────────────────
# Wrike Clone — CI Pipeline
# Runs on push to main and all pull requests
# ──────────────────────────────────────────────

name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  NPM_CONFIG_AUDIT: false
  NPM_CONFIG_FUND: false

jobs:
  # ── Lint ─────────────────────────────────────
  lint:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci --include-workspace-root

      - name: Build shared package
        run: npm run build -w packages/shared

      - name: TypeScript type-check
        run: npm run typecheck

      - name: Prettier format check
        run: npm run format:check

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=critical

  # ── Test ─────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: wrike_clone_test
          POSTGRES_USER: wrike
          POSTGRES_PASSWORD: wrike_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci --include-workspace-root

      - name: Build shared package
        run: npm run build -w packages/shared

      - name: Run backend tests
        run: npm run test -w packages/backend
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: wrike_clone_test
          DB_USER: wrike
          DB_PASSWORD: wrike_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379

      - name: Run frontend tests
        run: npm run test -w packages/frontend
        env:
          NODE_ENV: test

  # ── Build ────────────────────────────────────
  build:
    name: Build Packages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [test]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci --include-workspace-root

      - name: Build shared package
        run: npm run build -w packages/shared

      - name: Build backend
        run: npm run build -w packages/backend

      - name: Build frontend
        run: npm run build -w packages/frontend

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            packages/shared/dist
            packages/backend/dist
            packages/frontend/dist
          retention-days: 3

  # ── Docker (main branch only) ────────────────
  docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main'
    needs: [build]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.backend
          push: false
          tags: wrike-clone/backend:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.frontend
          push: false
          tags: wrike-clone/frontend:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
